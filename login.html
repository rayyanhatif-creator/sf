<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسجيل الدخول | ورش السعودية</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">
    <a href="index.html" class="logo">ورش السعودية</a>
</header>

<main class="auth-page">

<div class="auth-card">

<h1>أهلًا بك</h1>
<p>سجل دخولك إلى حسابك في ورش السعودية</p>

<form onsubmit="login(event)">

<input id="loginEmail"
type="text"
placeholder="البريد الإلكتروني أو رقم الجوال"
required>

<input id="loginPassword"
type="password"
placeholder="كلمة المرور"
required>

<button class="main-btn" type="submit">
تسجيل الدخول
</button>

</form>

<div id="loginMessage"></div>

<hr>

<p>ما عندك حساب؟</p>

<a href="register.html" class="text-link">
إنشاء حساب زبون
</a>

<br>

<a href="workshop-register.html" class="text-link">
اشترك معنا كخراط
</a>

</div>

</main>

<script src="app.js"></script>
</body>
</html>
