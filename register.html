<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إنشاء حساب | ورش السعودية</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">
<a href="index.html" class="logo">ورش السعودية</a>
</header>

<main class="auth-page">

<div class="auth-card">

<h1>إنشاء حساب</h1>

<p>سجل معنا حتى تقدر تحجز دورك</p>

<form onsubmit="registerCustomer(event)">

<input id="customerName"
placeholder="الاسم الكامل"
required>

<input id="customerPhone"
placeholder="رقم الجوال"
required>

<input id="customerEmail"
type="email"
placeholder="البريد الإلكتروني"
required>

<input id="customerCity"
placeholder="المدينة"
required>

<input id="customerPassword"
type="password"
placeholder="كلمة المرور"
required>

<input id="customerPassword2"
type="password"
placeholder="تأكيد كلمة المرور"
required>

<button class="main-btn">
إنشاء الحساب
</button>

</form>

<div id="registerMessage"></div>

<p>
لديك حساب؟
<a href="login.html" class="text-link">
تسجيل الدخول
</a>
</p>

</div>

</main>

<script src="app.js"></script>

</body>
</html>
