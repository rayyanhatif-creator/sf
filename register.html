<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إنشاء حساب | ورش السعودية</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="register.css">
</head>

<body>

<header class="topbar">

    <a href="index.html" class="brand">

        <span class="brand-line"></span>

        <div>
            <strong>ورش السعودية</strong>
            <small>منصة الحرفة السعودية</small>
        </div>

    </a>

    <button
        class="menu-button"
        onclick="toggleMenu()">

        <span></span>
        <span></span>
        <span></span>

    </button>

</header>


<main class="register-page">

    <section class="register-card">

        <div class="register-heading">

            <div class="section-label">
                حساب جديد
            </div>

            <h1>
                سجّل
                <span>معنا.</span>
            </h1>

            <p>
                أنشئ حسابك في ورش السعودية
                وابدأ بحجز دورك مع الخراطين.
            </p>

        </div>


        <form
            id="registerForm"
            class="register-form">


            <div class="form-group">

                <label>
                    الاسم الكامل
                </label>

                <input
                    type="text"
                    id="registerName"
                    placeholder="مثال: ريان الخليفي"
                    required>

            </div>


            <div class="form-group">

                <label>
                    رقم الجوال
                </label>

                <div class="phone-input">

                    <span>+966</span>

                    <input
                        type="tel"
                        id="registerPhone"
                        placeholder="5XXXXXXXX"
                        maxlength="9"
                        required>

                </div>

            </div>


            <div class="form-group">

                <label>
                    البريد الإلكتروني
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="example@email.com"
                    required>

            </div>


            <div class="form-group">

                <label>
                    الموقع
                </label>

                <input
                    type="text"
                    id="registerLocation"
                    placeholder="الرياض - حي ... "
                    required>

            </div>


            <div class="form-grid">

                <div class="form-group">

                    <label>
                        كلمة المرور
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="••••••••"
                        minlength="6"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        تأكيد كلمة المرور
                    </label>

                    <input
                        type="password"
                        id="registerPasswordConfirm"
                        placeholder="••••••••"
                        minlength="6"
                        required>

                </div>

            </div>


            <div
                id="registerError"
                class="register-error">
            </div>


            <label class="terms">

                <input
                    type="checkbox"
                    id="acceptTerms"
                    required>

                <span>
                    أوافق على شروط استخدام
                    <a href="#">ورش السعودية</a>
                </span>

            </label>


            <button
                type="submit"
                class="register-button">

                إنشاء الحساب

                <span>←</span>

            </button>

        </form>


        <div class="login-link">

            عندك حساب بالفعل؟

            <a href="login.html">
                تسجيل الدخول
            </a>

        </div>

    </section>

</main>


<footer>

    <div class="footer-brand">
        ورش السعودية
    </div>

    <p>
        نقرّب الحرفة من صاحبها،
        ونخلّي الوصول لأهلها أسهل.
    </p>

    <div class="footer-bottom">

        <span>
            جميع الحقوق محفوظة
        </span>

        <span>
            صنع بواسطة ورش السعودية
        </span>

    </div>

</footer>


<script src="app.js"></script>
<script src="register.js"></script>

</body>

</html>
