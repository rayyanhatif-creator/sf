<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>حجز دور | ورش السعودية</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="navbar">

<a href="index.html" class="logo">
ورش السعودية
</a>

</header>

<main class="auth-page">

<div class="auth-card">

<h1 id="bookingWorkshop">
حجز دور
</h1>

<p>
أكمل بيانات الحجز
</p>

<form onsubmit="createBooking(event)">

<input
id="bookingName"
placeholder="الاسم الكامل"
required>

<input
id="bookingPhone"
placeholder="رقم الجوال"
required>

<select id="bookingService" required>

<option value="">
اختر نوع الخدمة
</option>

<option>
خرط سبحة جديدة
</option>

<option>
تعديل سبحة
</option>

<option>
تصميم خاص
</option>

</select>

<input
id="bookingCount"
type="number"
min="1"
placeholder="عدد السبح"
required>

<input
id="bookingDate"
type="date"
required>

<select id="bookingTime" required>

<option value="">
اختر الوقت
</option>

<option>10:00 صباحًا</option>
<option>12:00 ظهرًا</option>
<option>2:00 مساءً</option>
<option>5:00 مساءً</option>
<option>8:00 مساءً</option>

</select>

<textarea
id="bookingNotes"
placeholder="ملاحظات إضافية">
</textarea>

<button class="main-btn">
تأكيد الحجز
</button>

</form>

</div>

</main>

<script src="app.js"></script>

<script>
loadBookingPage();
</script>

</body>
</html>
