<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>الخراطين | ورش السعودية</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="workshops.css">
</head>

<body>

<header class="topbar">

    <a href="index.html" class="brand">

        <span class="brand-line"></span>

        <div>
            <strong>ورش السعودية</strong>
            <small>منصة الحرفة السعودية</small>
        </div>

    </a>

    <button
        class="menu-button"
        onclick="toggleMenu()">

        <span></span>
        <span></span>
        <span></span>

    </button>

</header>


<main class="workshops-page">


    <!-- العنوان -->

    <section class="workshops-hero">

        <div class="section-label">
            اكتشف أهل الحرفة
        </div>

        <h1>
            الخراطين
            <span>السعوديين.</span>
        </h1>

        <p>
            اختر الورشة اللي تناسبك،
            وشوف تفاصيلها قبل ما تحجز دورك.
        </p>

    </section>


    <!-- البحث -->

    <section class="workshops-tools">

        <div class="search-box">

            <span>⌕</span>

            <input
                type="text"
                id="workshopSearch"
                placeholder="ابحث عن ورشة...">

        </div>


        <div class="workshop-count">

            <span id="workshopCount">
                0
            </span>

            ورش متاحة

        </div>

    </section>


    <!-- الورش -->

    <section
        id="workshopsList"
        class="workshops-list">

    </section>


    <div
        id="emptyWorkshops"
        class="empty-workshops">

        <div>
            لا توجد ورش بهذا الاسم.
        </div>

    </div>

</main>


<footer>

    <div class="footer-brand">
        ورش السعودية
    </div>

    <p>
        نقرّب الحرفة من صاحبها،
        ونخلّي الوصول لأهلها أسهل.
    </p>

    <div class="footer-bottom">

        <span>
            جميع الحقوق محفوظة
        </span>

        <span>
            صنع بواسطة ورش السعودية
        </span>

    </div>

</footer>


<script src="app.js"></script>
<script src="workshops.js"></script>

</body>

</html>
