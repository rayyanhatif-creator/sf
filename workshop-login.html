<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>دخول الورشة | ورش السعودية</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="workshop-login.css">
</head>

<body>

<header class="topbar">

    <a href="index.html" class="brand">

        <span class="brand-line"></span>

        <div>
            <strong>ورش السعودية</strong>
            <small>منصة الحرفة السعودية</small>
        </div>

    </a>

    <button
        class="menu-button"
        onclick="toggleMenu()">

        <span></span>
        <span></span>
        <span></span>

    </button>

</header>


<main class="workshop-login-page">

    <section class="workshop-login-card">

        <div class="workshop-login-heading">

            <div class="section-label">
                بوابة الورش
            </div>

            <h1>
                دخول
                <span>الورشة.</span>
            </h1>

            <p>
                سجّل دخولك لإدارة ورشتك
                ومتابعة الحجوزات الواردة.
            </p>

        </div>


        <form
            id="workshopLoginForm"
            class="workshop-login-form">


            <div class="form-group">

                <label>
                    اسم الورشة
                </label>

                <input
                    type="text"
                    id="workshopName"
                    placeholder="مثال: ورشة حرفة"
                    required>

            </div>


            <div class="form-group">

                <label>
                    رقم الجوال
                </label>

                <div class="phone-input">

                    <span>
                        +966
                    </span>

                    <input
                        type="tel"
                        id="workshopPhone"
                        placeholder="5XXXXXXXX"
                        maxlength="9"
                        required>

                </div>

            </div>


            <div class="form-group">

                <label>
                    كلمة المرور
                </label>

                <input
                    type="password"
                    id="workshopPassword"
                    placeholder="••••••••"
                    required>

            </div>


            <div
                id="workshopLoginError"
                class="workshop-login-error">
            </div>


            <button
                type="submit"
                class="workshop-login-button">

                دخول لوحة الورشة

                <span>←</span>

            </button>

        </form>


        <div class="workshop-register">

            <span>
                عندك ورشة وتبي تنضم معنا؟
            </span>

            <a href="workshop-register.html">
                اشترك معنا كخراط
                ←
            </a>

        </div>


        <a
            href="login.html"
            class="customer-login">

            ← العودة لتسجيل دخول العملاء

        </a>

    </section>

</main>


<footer>

    <div class="footer-brand">
        ورش السعودية
    </div>

    <p>
        نقرّب الحرفة من صاحبها،
        ونخلّي الوصول لأهلها أسهل.
    </p>

    <div class="footer-bottom">

        <span>
            جميع الحقوق محفوظة
        </span>

        <span>
            صنع بواسطة ورش السعودية
        </span>

    </div>

</footer>


<script src="app.js"></script>
<script src="workshop-login.js"></script>

</body>

</html>
